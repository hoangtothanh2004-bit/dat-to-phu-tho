name: Phát hành bản demo GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Cài thư viện
        run: pnpm install --frozen-lockfile

      - name: Xác định đường dẫn bản demo
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository_name" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            pages_base_path=""
          else
            pages_base_path="/$repository_name"
          fi
          echo "NEXT_PUBLIC_BASE_PATH=$pages_base_path" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io${pages_base_path}" >> "$GITHUB_ENV"

      - name: Chuẩn bị chế độ demo tĩnh
        run: mv app/api "$RUNNER_TEMP/app-api"

      - name: Build website
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_STATIC_DEMO: "true"
        run: pnpm build

      - name: Tắt xử lý Jekyll
        run: touch out/.nojekyll

      - name: Đóng gói website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Đưa website lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
